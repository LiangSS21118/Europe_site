<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歐洲行程輸入神器 ✈️</title>
  <!-- 引入 Tailwind CSS 作為樣式框架 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
  </style>
</head>
<body class="bg-slate-50 font-sans pb-10 text-slate-800">

  <!-- 標題列 -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-center items-center">
      <h1 class="text-xl font-bold">歐洲行程輸入器 ✈️</h1>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
    
    <!-- 主要輸入表單 -->
    <form id="tripForm" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
      
      <!-- 1. 選擇身份 -->
      <div>
        <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-3">
          <i class="fa-solid fa-user text-blue-500"></i> 你是誰？
        </label>
        <div class="grid grid-cols-2 gap-3" id="identityGroup">
          <button type="button" data-value="Liang" class="identity-btn py-3 rounded-xl font-medium border-2 border-blue-500 bg-blue-50 text-blue-700 transition-all">
            🙋‍♂️ Liang
          </button>
          <button type="button" data-value="Tsai" class="identity-btn py-3 rounded-xl font-medium border-2 border-slate-100 bg-slate-50 text-slate-500 hover:bg-slate-100 transition-all">
            🙋‍♂️ Tsai
          </button>
        </div>
      </div>

      <!-- 2. 選擇國家 -->
      <div>
        <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-3">
          <i class="fa-solid fa-location-dot text-blue-500"></i> 加入到哪個國家？
        </label>
        <div class="relative">
          <select id="countrySelect" class="w-full bg-slate-50 border-2 border-slate-100 text-slate-700 py-3 px-4 rounded-xl font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-all appearance-none">
            <option value="捷克">🇨🇿 捷克</option>
            <option value="荷蘭">🇳🇱 荷蘭</option>
            <option value="法國">🇫🇷 法國</option>
            <option value="英國">🇬🇧 英國</option>
            <option value="西班牙">🇪🇸 西班牙</option>
            <option value="義大利">🇮🇹 義大利</option>
            <option value="奧地利">🇦🇹 奧地利</option>
            <option value="匈牙利">🇭🇺 匈牙利</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
        </div>
      </div>

      <!-- 3. 選擇類別 -->
      <div>
        <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-3">
          <i class="fa-solid fa-tag text-blue-500"></i> 這是什麼類別？
        </label>
        <div class="grid grid-cols-3 gap-2" id="categoryGroup">
          <button type="button" data-value="想去的地方" class="category-btn py-2 px-1 text-sm rounded-lg font-medium border-2 border-indigo-500 bg-indigo-50 text-indigo-700 transition-all">
            🗺️ 景點
          </button>
          <button type="button" data-value="想吃的東西" class="category-btn py-2 px-1 text-sm rounded-lg font-medium border-2 border-slate-100 bg-slate-50 text-slate-500 hover:bg-slate-100 transition-all">
            🍜 美食
          </button>
          <button type="button" data-value="想做的事" class="category-btn py-2 px-1 text-sm rounded-lg font-medium border-2 border-slate-100 bg-slate-50 text-slate-500 hover:bg-slate-100 transition-all">
            🎯 體驗
          </button>
        </div>
      </div>

      <!-- 4. 輸入內容 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          寫下你想去的景點或美食：
        </label>
        <textarea
          id="itemInput"
          placeholder="例如：羅浮宮、吃海鮮燉飯..."
          rows="3"
          class="w-full bg-slate-50 border-2 border-slate-100 text-slate-800 py-3 px-4 rounded-xl focus:outline-none focus:border-blue-500 focus:bg-white transition-all resize-none"
        ></textarea>
      </div>

      <!-- 5. 提交按鈕 -->
      <button
        type="submit"
        id="submitBtn"
        class="w-full py-4 rounded-xl font-bold text-white flex justify-center items-center gap-2 transition-all bg-slate-300 cursor-not-allowed pointer-events-none"
      >
        <i id="submitIcon" class="fa-solid fa-paper-plane"></i>
        <span id="submitText">發送到試算表</span>
      </button>

    </form>
  </main>

  <script>
    // =========================================================================
    // 💡 這裡已經幫你填好你的 Google Apps Script 網址囉！
    // =========================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzEf5Mc_olMRl4Thd2Sox92XVL08E-vCME5T63FRIP1qr5ihH0Jbb2aI5G6RN7DNYRh/exec";
    // =========================================================================

    document.addEventListener('DOMContentLoaded', () => {
      // 狀態變數
      let state = {
        identity: 'Liang',
        country: '捷克',
        category: '想去的地方'
      };

      // DOM 元素
      const identityBtns = document.querySelectorAll('.identity-btn');
      const countrySelect = document.getElementById('countrySelect');
      const categoryBtns = document.querySelectorAll('.category-btn');
      const itemInput = document.getElementById('itemInput');
      
      const tripForm = document.getElementById('tripForm');
      const submitBtn = document.getElementById('submitBtn');
      const submitIcon = document.getElementById('submitIcon');
      const submitText = document.getElementById('submitText');

      // 檢查輸入是否有效以啟用按鈕
      const checkFormValidity = () => {
        const text = itemInput.value.trim();
        if (text.length > 0) {
          submitBtn.classList.remove('bg-slate-300', 'cursor-not-allowed', 'pointer-events-none');
          submitBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'active:scale-95');
        } else {
          submitBtn.classList.add('bg-slate-300', 'cursor-not-allowed', 'pointer-events-none');
          submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'active:scale-95');
        }
      };

      // 選擇身份
      identityBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.identity = e.currentTarget.dataset.value;
          identityBtns.forEach(b => {
            b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            b.classList.add('border-slate-100', 'bg-slate-50', 'text-slate-500');
          });
          e.currentTarget.classList.remove('border-slate-100', 'bg-slate-50', 'text-slate-500');
          e.currentTarget.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
        });
      });

      // 選擇國家
      countrySelect.addEventListener('change', (e) => {
        state.country = e.target.value;
      });

      // 選擇類別
      categoryBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.category = e.currentTarget.dataset.value;
          categoryBtns.forEach(b => {
            b.classList.remove('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');
            b.classList.add('border-slate-100', 'bg-slate-50', 'text-slate-500');
          });
          e.currentTarget.classList.remove('border-slate-100', 'bg-slate-50', 'text-slate-500');
          e.currentTarget.classList.add('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');
        });
      });

      // 監聽輸入框
      itemInput.addEventListener('input', checkFormValidity);

      // 表單送出
      tripForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = itemInput.value.trim();
        
        if (!text) return;

        // 顯示載入中狀態
        submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'active:scale-95');
        submitBtn.classList.add('bg-blue-500', 'cursor-wait', 'pointer-events-none');
        submitIcon.className = 'fa-solid fa-spinner fa-spin';
        submitText.textContent = '傳送中...';

        try {
          // 組合 URL
          const submitUrl = new URL(GAS_URL);
          submitUrl.searchParams.append('identity', state.identity);
          submitUrl.searchParams.append('country', state.country);
          submitUrl.searchParams.append('category', state.category);
          submitUrl.searchParams.append('item', text);

          // 發送請求 (no-cors 模式解決跨網域問題)
          await fetch(submitUrl.toString(), {
            method: 'GET',
            mode: 'no-cors'
          });

          // 成功狀態
          submitBtn.classList.remove('bg-blue-500', 'cursor-wait');
          submitBtn.classList.add('bg-green-500');
          submitIcon.className = 'fa-solid fa-circle-check';
          submitText.textContent = '已成功加入試算表！';
          
          itemInput.value = ''; // 清空輸入框
          
          // 3秒後恢復
          setTimeout(() => {
            submitBtn.classList.remove('pointer-events-none', 'bg-green-500');
            checkFormValidity();
            submitIcon.className = 'fa-solid fa-paper-plane';
            submitText.textContent = '發送到試算表';
          }, 3000);

        } catch (error) {
          console.error('Error:', error);
          // 錯誤狀態
          submitBtn.classList.remove('bg-blue-500', 'cursor-wait');
          submitBtn.classList.add('bg-red-500');
          submitIcon.className = 'fa-solid fa-circle-exclamation';
          submitText.textContent = '傳送失敗，請重試';

          setTimeout(() => {
            submitBtn.classList.remove('pointer-events-none', 'bg-red-500');
            checkFormValidity();
            submitIcon.className = 'fa-solid fa-paper-plane';
            submitText.textContent = '發送到試算表';
          }, 3000);
        }
      });
    });
  </script>
</body>
</html>
